# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # dune.lock is solved for linux and macos only
        runs-on: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # aws-c-auth fixtures; without them the suite is skipped
          submodules: true
      - uses: ocaml-dune/setup-dune@v2.1.0
        with:
          # Keep in sync with the local dune; nightly would make dune.lock churn
          version: 3.23.1

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml-dune/setup-dune@v2.1.0
        with:
          version: 3.23.1
          steps: install-dune enable-pkg
      - run: dune tools install ocamlformat
      - run: |
          eval "$(dune tools env)"
          dune build @fmt
